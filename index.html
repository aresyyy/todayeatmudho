<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>todayeatmudho</title>

  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon512.png" />
  <link rel="manifest" href="./manifest.json" />

  <meta name="theme-color" content="#F7D900" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="todayeatmudho" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Noto Sans HK', sans-serif;
      background-color: #F7D900;
      color: #1f2937;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      box-shadow: 0 24px 70px rgba(31, 41, 55, 0.20);
    }

    .app-content {
      background:
        linear-gradient(180deg, #ffffff 0%, #fffaf0 52%, #ffffff 100%);
    }

    .pressable {
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .pressable:active {
      transform: scale(0.985);
    }

    .soft-input {
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .animate-pop {
      animation: pop 0.3s ease-out;
    }

    .logo-crop-box {
      width: 100%;
      height: 155px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #F7D900;
      position: relative;
    }

    .logo-crop-img {
      width: 19rem;
      height: auto;
      object-fit: contain;
      transform: translateY(0px);
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #F7D900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .loading-logo {
      width: 230px;
      height: auto;
      animation:
        logoBounceIn 0.75s cubic-bezier(.2, 1.25, .35, 1) both,
        logoBreath 1.35s ease-in-out 0.75s infinite;
      transform-origin: center;
    }

    .loading-text {
      margin-top: 18px;
      font-size: 13px;
      font-weight: 800;
      color: #1f2937;
      letter-spacing: 0.12em;
    }

    .loading-dot {
      display: inline-block;
      animation: dotBlink 1.2s infinite;
    }

    @keyframes pop {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes logoBounceIn {
      0% { transform: scale(0.35); opacity: 0; }
      55% { transform: scale(1.14); opacity: 1; }
      75% { transform: scale(0.94); }
      100% { transform: scale(1); }
    }

    @keyframes logoBreath {
      0% { transform: scale(1); }
      50% { transform: scale(1.045); }
      100% { transform: scale(1); }
    }

    @keyframes dotBlink {
      0% { opacity: 0.2; }
      50% { opacity: 1; }
      100% { opacity: 0.2; }
    }

    @media (max-width: 420px) {
      .logo-crop-box {
        height: 145px;
      }

      .logo-crop-img {
        width: 14.75rem;
      }

      .loading-logo {
        width: 210px;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 0;
      }

      .app-shell {
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center py-6 px-4 selection:bg-yellow-200">

  <div id="root" class="app-shell w-full max-w-md bg-white rounded-[2rem] overflow-hidden min-h-[680px] flex flex-col animate-pop"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      updateDoc,
      doc,
      getDocs,
      deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    import React, { useState, useEffect } from "https://esm.sh/react@18.2.0";
    import { createRoot } from "https://esm.sh/react-dom@18.2.0/client";

    const firebaseConfig = {
      apiKey: "AIzaSyC9CBmZPxIWFuv4Mh9lCYcUQeIlpJvsWb0",
      authDomain: "todayeatmudho.firebaseapp.com",
      projectId: "todayeatmudho",
      storageBucket: "todayeatmudho.firebasestorage.app",
      messagingSenderId: "933067531078",
      appId: "1:933067531078:web:98c023925a12ac2d973b47"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ADMIN_PASSWORD = "0118";

    function getHongKongDateInfo() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Hong_Kong",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());

      const valueOf = (type) => parts.find((part) => part.type === type)?.value;

      return {
        dateKey: `${valueOf("year")}-${valueOf("month")}-${valueOf("day")}`,
        hour: Number(valueOf("hour")),
        minute: Number(valueOf("minute"))
      };
    }

    function shouldPauseAutoCutoffToday() {
      const hongKongNow = getHongKongDateInfo();

      if (hongKongNow.hour > 11 || (hongKongNow.hour === 11 && hongKongNow.minute >= 0)) {
        return hongKongNow.dateKey;
      }

      return null;
    }

    function LoadingScreen() {
      return (
        <div className="loading-screen">
          <img
            src="./logo192.png"
            alt="todayeatmudho loading"
            className="loading-logo"
          />
          <div className="loading-text">
            載入中<span className="loading-dot">...</span>
          </div>
        </div>
      );
    }

    function shuffleList(list) {
      return [...list]
        .map((item) => ({ ...item, random: Math.random() }))
        .sort((a, b) => a.random - b.random)
        .map((item, index) => ({
          ...item,
          sortOrder: index + 1
        }));
    }

    function NameModal({ userName, setUserName, setTempName, tempName, onSaveName }) {
      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[9998] flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 w-full max-w-sm text-center shadow-xl border border-gray-100 animate-pop">
            <div className="w-16 h-16 bg-amber-50 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
              👤
            </div>

            <h3 className="text-xl font-black text-gray-800">
              先設定你個名
            </h3>

            <p className="text-xs text-gray-400 mt-2 leading-relaxed">
              之後投票同落單會自動用呢個名，唔使每次再輸入。
            </p>

            <input
              type="text"
              placeholder="例如：Ka Ho"
              value={tempName}
              onChange={(e) => setTempName(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter") {
                  onSaveName();
                }
              }}
              className="w-full mt-5 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm text-center font-bold focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white transition-all"
              autoFocus
            />

            <button
              onClick={onSaveName}
              className="w-full mt-4 py-3 bg-amber-500 text-white font-black rounded-xl text-sm shadow-md hover:bg-amber-600 transition-all"
            >
              儲存名字
            </button>
          </div>
        </div>
      );
    }

    function App() {
      const [isLoading, setIsLoading] = useState(true);
      const [canHideLoading, setCanHideLoading] = useState(false);
      const [dataReady, setDataReady] = useState(false);

      const [stage, setStage] = useState("vote");
      const [restaurants, setRestaurants] = useState([]);
      const [hasVoted, setHasVoted] = useState(false);
      const [winner, setWinner] = useState(null);
      const [orders, setOrders] = useState([]);
      const [autoCutoffDate, setAutoCutoffDate] = useState(null);

      const [userName, setUserName] = useState("");
      const [tempName, setTempName] = useState("");
      const [showNameModal, setShowNameModal] = useState(false);

      const [food, setFood] = useState("");
      const [drink, setDrink] = useState("");
      const [globalNotification, setGlobalNotification] = useState(null);

      useEffect(() => {
        const savedName = localStorage.getItem("todayeatmudho_userName");

        if (savedName && savedName.trim() !== "") {
          setUserName(savedName.trim());
          setTempName(savedName.trim());
          setShowNameModal(false);
        } else {
          setShowNameModal(true);
        }
      }, []);

      useEffect(() => {
        const minimumLoadingTimer = setTimeout(() => {
          setCanHideLoading(true);
        }, 2200);

        const maximumLoadingTimer = setTimeout(() => {
          setIsLoading(false);
        }, 2800);

        const unsubscribeVotes = onSnapshot(collection(db, "restaurants"), (snapshot) => {
          const rData = snapshot.docs.map((docItem) => ({
            id: docItem.id,
            ...docItem.data()
          }));

          setRestaurants(
            rData.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0))
          );

          setDataReady(true);
        });

        const unsubscribeOrders = onSnapshot(collection(db, "orders"), (snapshot) => {
          const oData = snapshot.docs.map((docItem) => ({
            id: docItem.id,
            ...docItem.data()
          }));

          setOrders(oData);
        });

        let isFirstLoad = true;

        const unsubscribeStage = onSnapshot(collection(db, "systemState"), (snapshot) => {
          if (!snapshot.empty) {
            const state = snapshot.docs[0].data();

            if (!isFirstLoad && state.stage === "order" && state.winner) {
              try {
                const audio = new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-84.wav");
                audio.play();
              } catch (e) {}

              setGlobalNotification(`今日精選餐廳：${state.winner.name}`);
            }

            setStage(state.stage || "vote");
            setAutoCutoffDate(state.autoCutoffDate || shouldPauseAutoCutoffToday());

            if (state.winner) {
              setWinner(state.winner);
            }

            isFirstLoad = false;
          }

          setDataReady(true);
        });

        return () => {
          clearTimeout(minimumLoadingTimer);
          clearTimeout(maximumLoadingTimer);
          unsubscribeVotes();
          unsubscribeOrders();
          unsubscribeStage();
        };
      }, []);

      useEffect(() => {
        if (canHideLoading && dataReady) {
          setIsLoading(false);
        }
      }, [canHideLoading, dataReady]);

      useEffect(() => {
        if (!userName) {
          setHasVoted(false);
          return;
        }

        const alreadyVoted = restaurants.some((r) =>
          Array.isArray(r.voters) && r.voters.includes(userName)
        );

        setHasVoted(alreadyVoted);
      }, [restaurants, userName]);

      useEffect(() => {
        const checkAutoCutoff = () => {
          const hongKongNow = getHongKongDateInfo();

          if (
            stage !== "vote" ||
            autoCutoffDate === hongKongNow.dateKey ||
            restaurants.length === 0
          ) {
            return;
          }

          if (hongKongNow.hour >= 11) {
            finalizeVote(true);
          }
        };

        checkAutoCutoff();
        const autoCutoffTimer = setInterval(checkAutoCutoff, 30000);

        return () => clearInterval(autoCutoffTimer);
      }, [stage, restaurants, autoCutoffDate]);

      const saveUserName = () => {
        const cleanedName = tempName.trim();

        if (!cleanedName) {
          return alert("請輸入名字");
        }

        localStorage.setItem("todayeatmudho_userName", cleanedName);
        setUserName(cleanedName);
        setTempName(cleanedName);
        setShowNameModal(false);
      };

      const changeUserName = () => {
        setTempName(userName || "");
        setShowNameModal(true);
      };

      const forceResetToNewRestaurants = async () => {
        const qSnapshot = await getDocs(collection(db, "systemState"));

        for (let d of qSnapshot.docs) {
          await deleteDoc(doc(db, "systemState", d.id));
        }

        await addDoc(collection(db, "systemState"), {
          stage: "vote",
          winner: null,
          autoCutoffDate: shouldPauseAutoCutoffToday()
        });

        const restDocs = await getDocs(collection(db, "restaurants"));

        for (let d of restDocs.docs) {
          await deleteDoc(doc(db, "restaurants", d.id));
        }

        const orderDocs = await getDocs(collection(db, "orders"));

        for (let d of orderDocs.docs) {
          await deleteDoc(doc(db, "orders", d.id));
        }

        const defaultList = [
          {
            name: "🔥 火將軍外賣專門店",
            votes: 0,
            voters: [],
            menuUrl: "https://url.mykeeta.com/OtCclkWz",
            imgUrl: "./images/generalfire.jpeg"
          },
          {
            name: "🥤 四季冰室",
            votes: 0,
            voters: [],
            menuUrl: "https://url.mykeeta.com/igw2zM6z",
            imgUrl: "./images/seasonsdafe.jpeg"
          },
          {
            name: "🥛 上海豆漿大王",
            votes: 0,
            voters: [],
            menuUrl: "https://url.mykeeta.com/enrsm48z",
            imgUrl: "./images/bigbean.webp"
          },
          {
            name: "🥟 小川滬拉麵小籠包",
            votes: 0,
            voters: [],
            menuUrl: "https://url.mykeeta.com/KjB9tkUz",
            imgUrl: "./images/siu.jpeg"
          }
        ];

        const shuffledList = shuffleList(defaultList);

        for (let r of shuffledList) {
          await addDoc(collection(db, "restaurants"), r);
        }
      };

      const handleVote = async (id, currentVotes, currentVoters = []) => {
        if (!userName) {
          setShowNameModal(true);
          return;
        }

        const allVoters = restaurants.flatMap((r) => r.voters || []);

        if (allVoters.includes(userName)) {
          return alert(`${userName} 已經投咗票啦！`);
        }

        const rRef = doc(db, "restaurants", id);

        await updateDoc(rRef, {
          votes: (currentVotes || 0) + 1,
          voters: [...(currentVoters || []), userName]
        });

        setHasVoted(true);
      };

      const finalizeVote = async (isAutoCutoff = false) => {
        const validRestaurants = restaurants.filter((r) => r && r.name);

        const highest = [...validRestaurants].sort(
          (a, b) => (b.votes || 0) - (a.votes || 0)
        )[0];

        if (!highest) {
          return alert("結算失敗，請重試！");
        }

        const qSnapshot = await getDocs(collection(db, "systemState"));

        if (!qSnapshot.empty) {
          await updateDoc(doc(db, "systemState", qSnapshot.docs[0].id), {
            stage: "order",
            winner: highest,
            autoCutoffDate: isAutoCutoff ? getHongKongDateInfo().dateKey : autoCutoffDate
          });
        } else {
          await addDoc(collection(db, "systemState"), {
            stage: "order",
            winner: highest,
            autoCutoffDate: isAutoCutoff ? getHongKongDateInfo().dateKey : autoCutoffDate
          });
        }
      };

      const handleEndVote = async () => {
        const password = window.prompt("請輸入管理員暗號：");

        if (password !== ADMIN_PASSWORD) {
          return alert("暗號錯誤！❌");
        }

        await finalizeVote(false);
      };

      const handleOrderSubmit = async (e) => {
        e.preventDefault();

        if (!userName) {
          setShowNameModal(true);
          return;
        }

        if (!food) {
          return alert("請填寫主餐！");
        }

        const existingOrder = orders.find((order) => order.name === userName);

        if (existingOrder) {
          const confirmAdd = window.confirm(
            `${userName} 已經落過單，是否仍然新增多一張單？`
          );

          if (!confirmAdd) {
            return;
          }
        }

        await addDoc(collection(db, "orders"), {
          name: userName,
          food,
          drink,
          timestamp: new Date()
        });

        setFood("");
        setDrink("");
      };

      const handleReset = async () => {
        const password = window.prompt("請輸入管理員暗號以進行重設：");

        if (password !== ADMIN_PASSWORD) {
          return alert("暗號錯誤！❌");
        }

        if (!window.confirm("確定要洗牌並開啟全新的一天嗎？")) {
          return;
        }

        await forceResetToNewRestaurants();
        setHasVoted(false);
      };

      return (
        <>
          {isLoading && <LoadingScreen />}

          {showNameModal && (
            <NameModal
              userName={userName}
              setUserName={setUserName}
              tempName={tempName}
              setTempName={setTempName}
              onSaveName={saveUserName}
            />
          )}

          <div className="w-full flex flex-col flex-1">

            {globalNotification && (
              <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl p-6 w-full max-w-sm text-center shadow-xl border border-gray-100">
                  <div className="w-14 h-14 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    📢
                  </div>

                  <h3 className="text-xl font-bold text-gray-800">
                    投票結果公布！
                  </h3>

                  <p className="text-emerald-600 font-black text-lg mt-2 bg-emerald-50 py-2 px-4 rounded-xl inline-block">
                    {globalNotification}
                  </p>

                  <p className="text-xs text-gray-400 mt-3">
                    快啲去打開 KeeTa 睇餐牌落單啦！🍱
                  </p>

                  <button
                    onClick={() => setGlobalNotification(null)}
                    className="w-full mt-5 py-3 bg-gray-900 text-white font-bold rounded-xl text-sm shadow-md hover:bg-black transition-all"
                  >
                    收到，即刻落單！ 🚀
                  </button>
                </div>
              </div>
            )}

            <div className="logo-crop-box">
              <button
                onClick={changeUserName}
                className="absolute top-3 right-3 text-[10px] font-black bg-white/80 hover:bg-white text-gray-800 px-3 py-1.5 rounded-full transition-all shadow-sm border border-white/70"
              >
                {userName ? `👤 ${userName}` : "設定名字"}
              </button>

              <img
                src="./logo192.png"
                alt="todayeatmudho Logo"
                className="logo-crop-img"
              />
            </div>

            <div className="app-content p-4 flex-1 flex flex-col">
              {stage === "vote" && (
                <div className="space-y-4 flex-1 flex flex-col">
                  <div className="text-center my-1">
                    <span className="bg-gray-900 text-white text-[11px] font-black px-3 py-1.5 rounded-full shadow-sm">
                      第一階段：今日食邊間？
                    </span>

                    {userName && (
                      <p className="text-[11px] text-gray-400 mt-2">
                        目前身份：<span className="font-bold text-gray-600">{userName}</span>
                      </p>
                    )}
                  </div>

                  {restaurants.length === 0 && (
                    <button
                      onClick={forceResetToNewRestaurants}
                      className="w-full py-3.5 bg-red-500 text-white rounded-xl font-bold animate-pulse shadow-md"
                    >
                      ⚠️ 雲端數據已清空，點擊一鍵初始化新餐廳
                    </button>
                  )}

                  <div className="space-y-3 flex-1">
                    {restaurants.map((r) =>
                      r && r.name ? (
                        <div
                          key={r.id}
                          className={`pressable flex bg-white border p-3 rounded-[1.35rem] shadow-sm hover:shadow-md duration-200 ${
                            Array.isArray(r.voters) && r.voters.includes(userName)
                              ? "border-amber-400 ring-2 ring-amber-100"
                              : "border-gray-100"
                          }`}
                        >
                          <img
                            src={r.imgUrl}
                            alt={r.name}
                            className="w-[6.35rem] h-[6.35rem] object-cover rounded-2xl flex-shrink-0 border border-gray-100 shadow-inner"
                          />

                          <div className="flex-1 pl-3 flex flex-col justify-between">
                            <div>
                              <div className="flex items-start justify-between gap-2">
                                <span className="font-black text-[15px] text-gray-900 block leading-tight">
                                  {r.name}
                                </span>

                                <span className="shrink-0 bg-gray-900 text-white text-[10px] font-black px-2 py-1 rounded-full leading-none">
                                  {r.votes || 0}票
                                </span>
                              </div>

                              <a
                                href={r.menuUrl}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="text-[11px] text-gray-700 font-black bg-amber-100/70 px-2.5 py-1 rounded-full mt-2 inline-flex items-center hover:bg-amber-200 transition-all"
                              >
                                🔍 睇 KeeTa 餐牌 ➔
                              </a>
                            </div>

                            <div className="flex items-end justify-between mt-2">
                              <div className="flex flex-col min-w-0">
                                {r.voters && r.voters.length > 0 && (
                                  <span className="text-[10px] text-gray-500 bg-gray-50 px-2 py-1 rounded-full mt-0.5 max-w-[150px] truncate">
                                    👤 {r.voters.join(", ")}
                                  </span>
                                )}
                              </div>

                              <button
                                onClick={() => handleVote(r.id, r.votes, r.voters)}
                                className={`px-3.5 py-2 text-xs font-black rounded-full transition-all ${
                                  Array.isArray(r.voters) && r.voters.includes(userName)
                                    ? "bg-amber-500 text-white shadow-sm"
                                    : hasVoted
                                      ? "bg-gray-100 text-gray-400"
                                      : "bg-gray-900 text-white hover:bg-black shadow-sm"
                                }`}
                              >
                                {Array.isArray(r.voters) && r.voters.includes(userName)
                                  ? "你投咗"
                                  : hasVoted
                                    ? "已投"
                                    : "投一票"}
                              </button>
                            </div>
                          </div>
                        </div>
                      ) : null
                    )}
                  </div>

                  <div className="flex justify-end pt-1">
                    <button
                      onClick={handleEndVote}
                      className="text-[10px] text-gray-300 hover:text-gray-500 transition-all px-2 py-1"
                    >
                      管理
                    </button>
                  </div>
                </div>
              )}

              {stage === "order" && winner && (
                <div className="space-y-4 flex-1 flex flex-col">
                  <div className="text-center">
                    <span className="bg-gray-900 text-white text-[11px] font-black px-3 py-1.5 rounded-full shadow-sm">
                      第二階段：開飯落單
                    </span>

                    <div className="pressable flex items-center bg-emerald-50/70 border border-emerald-100 p-3 rounded-[1.35rem] mt-3 shadow-sm hover:border-emerald-200">
                      <img
                        src={winner.imgUrl}
                        alt={winner.name}
                        className="w-16 h-16 object-cover rounded-2xl border border-white shadow-sm"
                      />

                      <div className="pl-3 text-left">
                        <p className="text-[10px] font-black text-emerald-600">
                          今日最高票精選
                        </p>

                        <h2 className="text-base font-black text-gray-900 leading-tight mt-0.5">
                          {winner.name}
                        </h2>
                      </div>
                    </div>

                    <a
                      href={winner.menuUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="inline-flex items-center justify-center w-full text-sm font-black text-white bg-emerald-500 hover:bg-emerald-600 py-3.5 rounded-2xl mt-3 shadow-md transition-all"
                    >
                      打開 KeeTa 睇餐牌落單 ➔
                    </a>
                  </div>

                  <form onSubmit={handleOrderSubmit} className="space-y-2.5 pt-1 relative">
                    <div className="soft-input w-full px-4 py-3 bg-white border border-gray-200 rounded-2xl text-sm flex items-center justify-between shadow-sm">
                      <span className="text-gray-400 text-xs font-bold">
                        落單人
                      </span>
                      <button
                        type="button"
                        onClick={changeUserName}
                        className="text-gray-900 text-sm font-black"
                      >
                        {userName || "設定名字"}
                      </button>
                    </div>

                    <input
                      type="text"
                      placeholder="想食咩主餐？（跟 KeeTa 名稱）"
                      value={food}
                      onChange={(e) => setFood(e.target.value)}
                      className="soft-input w-full px-4 py-3 bg-white border border-gray-200 rounded-2xl text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white transition-all"
                    />

                    <input
                      type="text"
                      placeholder="想飲咩？"
                      value={drink}
                      onChange={(e) => setDrink(e.target.value)}
                      className="soft-input w-full px-4 py-3 bg-white border border-gray-200 rounded-2xl text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white transition-all"
                    />

                    <button
                      type="submit"
                      className="w-full py-3.5 bg-gray-900 text-white font-black rounded-2xl text-sm shadow-md hover:bg-black transition-all"
                    >
                      提交今日點餐
                    </button>
                  </form>

                  <div className="flex items-center justify-between pt-1">
                    <h3 className="text-sm font-black text-gray-900">
                      今日落單名單
                    </h3>
                    <span className="text-[11px] font-black text-gray-500 bg-white border border-gray-100 px-2.5 py-1 rounded-full shadow-sm">
                      {orders.length} 人
                    </span>
                  </div>

                  <div className="max-h-56 overflow-y-auto space-y-2 flex-1 relative pr-0.5">
                    {orders.map((order, index) => (
                      <div
                        key={order.id || index}
                        className="pressable p-3.5 bg-white border border-gray-100 rounded-2xl shadow-sm hover:border-gray-200 duration-300 selection:bg-amber-100"
                      >
                        <div className="flex items-start justify-between gap-3">
                          <span className="text-sm font-black text-gray-900 block min-w-[58px]">
                            {order.name}
                          </span>

                          <div className="flex-1 space-y-1.5 text-right">
                            <div className="inline-flex max-w-full text-left text-xs font-black text-amber-900 bg-amber-50 border border-amber-100/70 px-3 py-1.5 rounded-xl">
                              <span className="text-amber-500 mr-1.5 shrink-0">主餐</span>
                              <span className="break-words">{order.food}</span>
                            </div>

                            <div>
                              <span
                                className={`inline-flex max-w-full text-left text-[11px] px-3 py-1.5 rounded-xl font-bold ${
                                  order.drink
                                    ? "bg-orange-50 text-orange-700 border border-orange-100/70"
                                    : "bg-gray-50 text-gray-400 border border-gray-100"
                                }`}
                              >
                                <span className="mr-1.5 shrink-0">飲品</span>
                                <span className="break-words">{order.drink || "唔要飲品"}</span>
                              </span>
                            </div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>

                  <button
                    onClick={handleReset}
                    className="self-end px-2 py-1 text-[10px] text-gray-200 hover:text-gray-400 transition-all"
                  >
                    管理重設
                  </button>
                </div>
              )}
            </div>
          </div>
        </>
      );
    }

    const container = document.getElementById("root");
    const root = createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
