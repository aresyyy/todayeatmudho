<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🍱 辦公室外賣神器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  </head>
  <body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
      // 引入 Firebase 瀏覽器版模組
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
      import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

      // 🎯 你的 todayeatmudho 專屬雲端金鑰
      const firebaseConfig = {
        apiKey: "AIzaSyC9CBmZPxIWFuv4Mh9lCYcUQeIlpJvsWb0",
        authDomain: "todayeatmudho.firebaseapp.com",
        projectId: "todayeatmudho",
        storageBucket: "todayeatmudho.firebasestorage.app",
        messagingSenderId: "933067531078",
        appId: "1:933067531078:web:98c023925a12ac2d973b47"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      function App() {
        const [stage, setStage] = React.useState('vote');
        const [restaurants, setRestaurants] = React.useState([]);
        const [hasVoted, setHasVoted] = React.useState(false);
        const [winner, setWinner] = React.useState(null);
        const [orders, setOrders] = React.useState([]);
        const [name, setName] = React.useState('');
        const [food, setFood] = React.useState('');
        const [drink, setDrink] = React.useState('');

        React.useEffect(() => {
          const unsubscribeVotes = onSnapshot(collection(db, "restaurants"), (snapshot) => {
            const rData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (rData.length === 0) { initDefaultRestaurants(); } 
            else { setRestaurants(rData.sort((a,b) => a.sortOrder - b.sortOrder)); }
          });

          const unsubscribeOrders = onSnapshot(collection(db, "orders"), (snapshot) => {
            const oData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setOrders(oData);
          });

          const unsubscribeStage = onSnapshot(collection(db, "systemState"), (snapshot) => {
            if (!snapshot.empty) {
              const state = snapshot.docs[0].data();
              setStage(state.stage);
              if (state.winner) setWinner(state.winner);
            }
          });

          return () => { unsubscribeVotes(); unsubscribeOrders(); unsubscribeStage(); };
        }, []);

        const initDefaultRestaurants = async () => {
          const defaultList = [
            { name: '🍱 華星冰室', votes: 0, sortOrder: 1, menuUrl: 'https://url.mykeeta.com/WzfImnpz', imgUrl: 'https://images.unsplash.com/photo-1563245372-f21724e3856d?w=500&auto=format&fit=crop&q=60' },
            { name: '🍗 🌟 Momo 炸雞店', votes: 0, sortOrder: 2, menuUrl: 'https://url.mykeeta.com/Xsfwrttz', imgUrl: 'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=500&auto=format&fit=crop&q=60' },
            { name: '🍛 譚仔三哥米線', votes: 0, sortOrder: 3, menuUrl: 'https://url.mykeeta.com/uUdS4oez', imgUrl: 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500&auto=format&fit=crop&q=60' }
          ];
          for (let r of defaultList) { await addDoc(collection(db, "restaurants"), r); }
          await addDoc(collection(db, "systemState"), { stage: 'vote', winner: null });
        };

        const handleVote = async (id, currentVotes) => {
          if (hasVoted) return alert('你已經投咗票啦！');
          await updateDoc(doc(db, "restaurants", id), { votes: currentVotes + 1 });
          setHasVoted(true);
        };

        const handleEndVote = async () => {
          const highest = [...restaurants].sort((a, b) => b.votes - a.votes)[0];
          const qSnapshot = await getDocs(collection(db, "systemState"));
          if (!qSnapshot.empty) {
            await updateDoc(doc(db, "systemState", qSnapshot.docs[0].id), { stage: 'order', winner: highest });
          }
        };

        const handleOrderSubmit = async (e) => {
          e.preventDefault();
          if (!name || !food) return alert('請填寫名字和主餐！');
          await addDoc(collection(db, "orders"), { name, food, drink, timestamp: new Date() });
          setName(''); setFood(''); setDrink('');
        };

        // 🔒 這裡已經完美安插了管理員密碼鎖 kaho，並且做好了分行處理
        const handleReset = async () => {
          const password = window.prompt("請輸入管理員暗號以進行重設：");
          if (password === null) return; 
          if (password !== "kaho") { 
            alert("暗號錯誤！你沒有權限重設數據。❌");
            return;
          }

          if(!window.confirm("確定要重設數據，開啟全新的一天嗎？")) return;
          
          const qSnapshot = await getDocs(collection(db, "systemState"));
          if (!qSnapshot.empty) { 
            await updateDoc(doc(db, "systemState", qSnapshot.docs[0].id), { stage: 'vote', winner: null }); 
          }
          for (let r of restaurants) { 
            await updateDoc(doc(db, "restaurants", r.id), { votes: 0 }); 
          }
          const orderDocs = await getDocs(collection(db, "orders"));
          orderDocs.forEach(async (d) => { 
            await deleteDoc(doc(db, "orders", d.id)); 
          });
          setHasVoted(false);
          alert("系統已成功重設，全新的一天開始囉！🚀");
        };

        return (
          <div className="min-h-screen bg-gray-50 flex flex-col items-center py-8 px-4 font-sans">
            <div className="w-full max-w-md bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
              <div className="bg-amber-500 p-6 text-center text-white">
                <h1 className="text-2xl font-bold tracking-wide">🍱 辦公室外賣神器</h1>
                <p className="text-amber-100 text-xs mt-1">📡 雲端即時同步版 · todayeatmudho</p>
              </div>

              <div className="p-6">
                {stage === 'vote' && (
                  <div className="space-y-4">
                    <div className="text-center mb-2">
                      <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full">第一階段：今日食邊間？</span>
                      <h2 className="text-lg font-bold text-gray-700 mt-2">📊 餐廳投票</h2>
                    </div>
                    <div className="space-y-3">
                      {restaurants.map(r => (
                        <div key={r.id} className="flex flex-col bg-gray-50 border border-gray-200 rounded-2xl overflow-hidden shadow-sm">
                          <img src={r.imgUrl} alt={r.name} className="w-full h-28 object-cover" />
                          <div className="p-4 flex items-center justify-between">
                            <div>
                              <span className="font-bold text-gray-800 block">{r.name}</span>
                              <span className="text-xs text-gray-400 mt-0.5 block">目前票數: <strong className="text-amber-600">{r.votes}</strong> 票</span>
                            </div>
                            <button onClick={() => handleVote(r.id, r.votes)} className={`px-4 py-2 text-xs font-bold rounded-xl transition-all ${hasVoted ? 'bg-gray-200 text-gray-400' : 'bg-amber-500 text-white hover:bg-amber-600'}`}>
                              {hasVoted ? '已投' : '👍 投一票'}
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                    <button onClick={handleEndVote} className="w-full mt-4 py-3 bg-gray-800 hover:bg-gray-900 text-white font-medium rounded-xl text-sm transition-all shadow-sm">
                      結束投票，去 KeeTa 點餐 ➔
                    </button>
                  </div>
                )}

                {stage === 'order' && winner && (
                  <div className="space-y-4">
                    <div className="text-center mb-2">
                      <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full">第二階段：開飯落單</span>
                      <h2 className="text-xl font-bold text-gray-800 mt-2">🎉 今日精選：{winner.name}</h2>
                      <a href={winner.menuUrl} target="_blank" rel="noopener noreferrer" className="inline-flex items-center justify-center w-full text-sm font-bold text-white bg-emerald-500 hover:bg-emerald-600 py-3 rounded-xl transition-all shadow-sm mt-3">
                        🟢 打開 KeeTa 睇餐牌落單 ➔
                      </a>
                    </div>

                    <form onSubmit={handleOrderSubmit} className="space-y-3 pt-2">
                      <input type="text" placeholder="你是誰？" value={name} onChange={(e) => setName(e.target.value)} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"/>
                      <input type="text" placeholder="想食咩主餐？（跟 KeeTa 名稱）" value={food} onChange={(e) => setFood(e.target.value)} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"/>
                      <input type="text" placeholder="想飲咩？" value={drink} onChange={(e) => setDrink(e.target.value)} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"/>
                      <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-medium rounded-xl text-sm transition-all shadow-sm">提交今日點餐 🚀</button>
                    </form>

                    <div className="relative my-6">
                      <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-gray-100"></div></div>
                      <div className="relative flex justify-center text-xs uppercase"><span className="bg-white px-3 text-gray-400 font-medium">今日落單名單 ({orders.length})</span></div>
                    </div>

                    <div className="max-h-60 overflow-y-auto space-y-2">
                      {orders.map((order, index) => (
                        <div key={index} className="flex items-center justify-between p-3 bg-gray-50 border border-gray-100 rounded-xl">
                          <div className="flex flex-col">
                            <span className="text-sm font-bold text-gray-700">{order.name}</span>
                            <span className="text-xs text-gray-400 mt-0.5">{order.drink ? `🥤 ${order.drink}` : '🚫 唔要飲品'}</span>
                          </div>
                          <div className="bg-amber-100/60 px-3 py-1.5 rounded-lg">
                            <span className="text-sm font-semibold text-amber-800">🍛 {order.food}</span>
                          </div>
                        </div>
                      ))}
                    </div>

                    <button onClick={handleReset} className="w-full py-2 text-xs text-gray-400 hover:text-gray-600 transition-all text-center mt-4">
                      🔄 重設並開啟全新的一天
                    </button>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
